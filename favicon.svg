<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="eggGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff7df"/>
      <stop offset="100%" stop-color="#f3d8a3"/>
    </radialGradient>
  </defs>
  <!-- egg body -->
  <ellipse cx="32" cy="36" rx="20" ry="25" fill="url(#eggGrad)" stroke="#b14bff" stroke-width="3"/>
  <!-- crack: jagged zigzag across the top -->
  <polyline points="14,28 20,24 24,30 30,22 36,30 42,22 48,30 52,24"
            fill="none" stroke="#15101e" stroke-width="2.4"
            stroke-linejoin="miter" stroke-linecap="round"/>
  <!-- neon spots -->
  <circle cx="24" cy="40" r="2.5" fill="#b14bff"/>
  <circle cx="40" cy="44" r="2" fill="#ff4fbf"/>
  <circle cx="34" cy="36" r="1.6" fill="#2ee6c8"/>
  <circle cx="22" cy="48" r="1.6" fill="#ffd84a"/>
</svg>
